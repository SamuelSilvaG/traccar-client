name: Build Android APK

on:
  push:
    branches: [ main, development ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk traccar-client-nso.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: traccar-client-apk
          path: traccar-client-nso.apk
          retention-days: 30
